name: "Account Pool Tests"

on:
  pull_request:
    branches:
      - main
      - litellm_internal_staging
      - litellm_oss_staging
      - "litellm_**"
  push:
    branches:
      - main
      - litellm_internal_staging

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  account-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.6
        env:
          POSTGRES_USER: llmproxy
          POSTGRES_PASSWORD: accountpool
          POSTGRES_DB: account_pool_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmproxy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: account-pool
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install dependencies
        run: |
          cd "${GITHUB_WORKSPACE}"
          .github/scripts/uv_sync_with_retries.sh --project account-pool --frozen --extra test

      - name: Run tests
        env:
          DATABASE_URL: postgresql://llmproxy:accountpool@localhost:5432/account_pool_test
        run: |
          .venv/bin/python -m pytest -q --tb=short
