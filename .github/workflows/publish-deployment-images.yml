name: Publish deployment images

on:
  workflow_call:
    inputs:
      architectures:
        description: 'amd64、arm64 或 amd64,arm64；留空使用仓库变量，未设置时为 arm64'
        required: false
        type: string
      source_ref:
        required: false
        type: string
      version_bump:
        required: false
        default: patch
        type: string
  workflow_dispatch:
    inputs:
      architectures:
        description: '构建目标架构'
        required: true
        default: arm64
        type: choice
        options:
          - arm64
          - amd64
          - amd64,arm64
      source_ref:
        description: '要构建的分支或完整 commit，留空使用当前工作流版本'
        required: false
        type: string
      version_bump:
        description: 'patch 自动递增末位；minor 下个版本；major 下个大版本'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - CLIProxyAPI分支
      - 'codex/fix-*'

concurrency:
  group: publish-deployment-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_REPOSITORY: ghcr.io/vvv-345/litellm-cliproxyapi

jobs:
  version:
    name: Resolve deployment version
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.platforms.outputs.architectures }}
      deploy_tag: ${{ steps.version.outputs.deploy_tag }}
      revision: ${{ steps.version.outputs.revision }}
      release_version: ${{ steps.version.outputs.release_version }}
      versioned_tag: ${{ steps.version.outputs.versioned_tag }}
      cliproxy_commit: ${{ steps.pin.outputs.commit }}
      cliproxy_tag: ${{ steps.pin.outputs.tag }}
      patch_sha256: ${{ steps.pin.outputs.patch_sha256 }}
      cpa_builder: ${{ steps.cpa.outputs.builder }}
      cpa_runtime: ${{ steps.cpa.outputs.runtime }}
      cpa_build_keys: ${{ steps.cpa.outputs.build_keys }}
      cpa_independent: ${{ steps.cpa.outputs.independent }}
    steps:
      - name: Resolve the selected source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - id: platforms
        name: Validate the selected build architectures
        env:
          ARCHITECTURES: ${{ inputs.architectures || vars.DEPLOY_ARCHITECTURES || 'arm64' }}
        run: python deploy/release_platforms.py "$ARCHITECTURES" >> "$GITHUB_OUTPUT"

      - id: version
        name: Resolve next successful product version and immutable deployment tag
        shell: bash
        env:
          VERSION_BUMP: ${{ inputs.version_bump || 'patch' }}
        run: |
          git tag --list > "$RUNNER_TEMP/successful-release-tags.txt"
          python deploy/release_version.py deploy/VERSION "$(git rev-parse HEAD)" \
            --tags-file "$RUNNER_TEMP/successful-release-tags.txt" --bump "$VERSION_BUMP" >> "$GITHUB_OUTPUT"

      - id: pin
        name: Verify the pinned adapter source and patch hash
        run: |
          python account-pool/cliproxy-adapter/image_ref.py >> "$GITHUB_OUTPUT"
          echo "patch_sha256=$(jq -er '.patch.sha256' account-pool/cliproxy-adapter/sources.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: cpa
        name: Resolve immutable CPA build inputs
        env:
          ARCHITECTURES: ${{ steps.platforms.outputs.architectures }}
          INDEPENDENT: ${{ vars.CPA_COMPONENT_REUSE == 'true' }}
        run: |
          builder="golang@$(docker buildx imagetools inspect golang:1.26-bookworm --format '{{.Manifest.Digest}}')"
          runtime="debian@$(docker buildx imagetools inspect debian:bookworm --format '{{.Manifest.Digest}}')"
          python deploy/cpa_build_identity.py --builder "$builder" --runtime "$runtime" --architectures "$(jq -r 'join(",")' <<< "$ARCHITECTURES")" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "independent=$INDEPENDENT" >> "$GITHUB_OUTPUT"

  verify-quota:
    name: Verify quota switching and release compatibility
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: proxy_catalog_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: proxy_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxy_catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: account-pool:.
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PROXY_CATALOG_TEST_DATABASE_URL: postgresql://proxy_catalog_test:isolated-test-only@127.0.0.1:5432/proxy_catalog_test
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Install locked backend dependencies
        run: .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra proxy
      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - name: Run quota, persistence and automatic replacement gates
        run: |
          uv run --no-sync python -m pytest -q \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_quota_failover.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_native_routing.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_failover.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_gateway.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_conversation.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_integration.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_reconciler.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_full_logs.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_observability.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_endpoints.py::test_proxy_admin_can_manage_upstream_compatibility_workflow \
            tests/test_litellm/proxy/management_endpoints/test_deployment_version.py \
            account-pool/tests/test_account_pool.py \
            account-pool/tests/account_pool/test_gateway_service.py \
            account-pool/tests/account_pool/test_upstream_sync.py \
            account-pool/tests/account_pool/test_settings.py \
            account-pool/tests/account_pool/test_policies.py \
            account-pool/tests/account_pool/test_cliproxy_runtime_image.py \
            account-pool/tests/account_pool/test_cliproxy_supplier_client.py \
            account-pool/tests/account_pool/test_runtime_maintenance.py \
            account-pool/tests/account_pool/test_isp_profiles.py \
            account-pool/tests/account_pool/test_isp_probe.py \
            tests/test_litellm/test_dockerfile_non_root.py \
            account-pool/tests/account_pool/test_proxy_catalog_schema.py \
            account-pool/tests/account_pool/test_proxy_catalog_postgres.py \
            account-pool/tests/account_pool/test_proxy_gateways.py \
            account-pool/tests/account_pool/test_proxy_configuration.py \
            account-pool/tests/test_release_auto_update.py \
            account-pool/tests/test_release_catalog.py \
            account-pool/tests/test_release_database.py \
            account-pool/tests/test_release_workflow.py \
            account-pool/tests/test_release_manifest.py \
            account-pool/tests/test_cpa_build_identity.py \
            account-pool/tests/test_releases.py \
            account-pool/tests/test_release_runtime.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: npm
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install and verify quota settings UI
        working-directory: ui/litellm-dashboard
        env:
          TZ: Asia/Shanghai
        run: |
          npm ci
          node --test scripts/braces-security.test.mjs
          npm exec -- vitest run --project component \
            src/components/Settings/RuntimeSettings/RuntimeSettingsSection.test.tsx \
            src/features/account-pool/components/dashboard/AccountPoolDashboard.test.tsx \
            src/features/account-pool/components/dashboard/AccountPoolSettingsOverview.test.tsx \
            src/features/account-pool/components/upstream/AccountPoolUpstreamSyncPanel.test.tsx
          npm exec -- vitest run --project integration \
            src/features/account-pool/components/proxy/ProxyManagerPanel.integration.test.tsx
          npm exec -- vitest run --project unit \
            src/features/account-pool/api/AccountPoolManagementApi.test.ts
          npm exec -- vitest run --project integration \
            src/features/account-pool/components/onboarding/AccountPoolOnboardingPanel.integration.test.tsx \
            src/features/account-pool/components/releases/AccountPoolRuntimeCards.integration.test.tsx

  build-and-publish:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [version, verify-quota]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        image: [litellm, manager, browser-worker, cliproxyapi]
        arch: ${{ fromJSON(needs.version.outputs.architectures) }}
        include:
          - image: litellm
            context: .
            file: Dockerfile
          - image: manager
            context: account-pool
            file: account-pool/Dockerfile
          - image: browser-worker
            context: account-pool
            file: account-pool/browser-worker/Dockerfile
          - image: cliproxyapi
            context: cliproxy-src
            file: account-pool/cliproxy-adapter/Dockerfile
    steps:
      - name: Check out the commit to publish
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false

      - name: Check out the pinned CLIProxyAPI commit
        if: matrix.image == 'cliproxyapi'
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: VVV-345/CLIProxyAPI
          ref: ${{ needs.version.outputs.cliproxy_commit }}
          path: cliproxy-src
          persist-credentials: false
      - name: Set up uv for adapter application
        if: matrix.image == 'cliproxyapi'
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Install locked adapter dependencies
        if: matrix.image == 'cliproxyapi'
        working-directory: account-pool
        run: uv sync --frozen --no-dev --no-editable
      - name: Apply the verified adaptation patch
        if: matrix.image == 'cliproxyapi'
        run: account-pool/.venv/bin/python account-pool/cliproxy-adapter/apply.py cliproxy-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: identity
        name: Bind component identity independently of product version
        env:
          IMAGE: ${{ matrix.image }}
          INDEPENDENT: ${{ needs.version.outputs.cpa_independent }}
          KEY: ${{ fromJSON(needs.version.outputs.cpa_build_keys)[matrix.arch] }}
          PRODUCT_REVISION: ${{ needs.version.outputs.revision }}
          CPA_REVISION: ${{ needs.version.outputs.cliproxy_commit }}
          PRODUCT_VERSION: ${{ needs.version.outputs.release_version }}
          CPA_VERSION: ${{ needs.version.outputs.cliproxy_tag }}
        run: |
          revision="$PRODUCT_REVISION"
          version="$PRODUCT_VERSION"
          if [ "$INDEPENDENT" = true ] && [ "$IMAGE" = cliproxyapi ]; then
            revision="$CPA_REVISION"
            version="$CPA_VERSION"
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$INDEPENDENT" = true ]; then echo "key=$KEY" >> "$GITHUB_OUTPUT"; fi

      - id: reuse
        name: Resolve previously verified CPA digest
        if: matrix.image == 'cliproxyapi' && needs.version.outputs.cpa_independent == 'true'
        env:
          KEY: ${{ steps.identity.outputs.key }}
          ARCH: ${{ matrix.arch }}
        run: |
          ref="${IMAGE_REPOSITORY}:cpa-${ARCH}-${KEY}"
          if digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/tmp/cpa-reuse-error)"; then
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          elif grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/cpa-reuse-error; then
            echo "No verified CPA image for this build key; building"
          else
            cat /tmp/cpa-reuse-error >&2
            exit 1
          fi

      - id: build
        if: steps.reuse.outputs.digest == ''
        name: Build ${{ matrix.image }} for ${{ matrix.arch }} by digest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            ${{ matrix.image == 'cliproxyapi' && format('CPA_BUILDER={0}', needs.version.outputs.cpa_builder) || '' }}
            ${{ matrix.image == 'cliproxyapi' && format('CPA_RUNTIME={0}', needs.version.outputs.cpa_runtime) || '' }}
            ${{ matrix.image == 'cliproxyapi' && format('VERSION={0}', needs.version.outputs.cliproxy_tag) || '' }}
            ${{ matrix.image == 'cliproxyapi' && format('COMMIT={0}', needs.version.outputs.cliproxy_commit) || '' }}
          labels: |
            ai.zlia.component=${{ matrix.image }}
            ai.zlia.cliproxy-source-revision=${{ needs.version.outputs.cliproxy_commit }}
            ai.zlia.cliproxy-patch-sha256=${{ needs.version.outputs.patch_sha256 }}
            ${{ matrix.image == 'cliproxyapi' && format('ai.zlia.source-revision={0}', needs.version.outputs.cliproxy_commit) || '' }}
            ${{ matrix.image == 'cliproxyapi' && format('ai.zlia.patch-sha256={0}', needs.version.outputs.patch_sha256) || '' }}
            ${{ matrix.image == 'cliproxyapi' && 'ai.zlia.managed-identity-version=1' || '' }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ${{ matrix.image == 'manager' && steps.identity.outputs.key != '' && format('ai.zlia.cliproxy-build-key={0}', steps.identity.outputs.key) || '' }}
            ${{ matrix.image == 'cliproxyapi' && steps.identity.outputs.key != '' && format('ai.zlia.build-key={0}', steps.identity.outputs.key) || '' }}
            org.opencontainers.image.revision=${{ steps.identity.outputs.revision }}
            org.opencontainers.image.version=${{ steps.identity.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - id: probe
        name: Probe the exact published platform digest
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
          REVISION: ${{ steps.identity.outputs.revision }}
          KEY: ${{ steps.identity.outputs.key }}
          CPA_REVISION: ${{ needs.version.outputs.cliproxy_commit }}
          PATCH_SHA256: ${{ needs.version.outputs.patch_sha256 }}
        run: |
          ref="${IMAGE_REPOSITORY}@${DIGEST}"
          docker pull "$ref"
          test "$(docker image inspect "$ref" --format '{{.Architecture}}')" = "$ARCH"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$REVISION"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "ai.zlia.component"}}')" = "$IMAGE"
          if [ "$IMAGE" = cliproxyapi ] && [ -n "$KEY" ]; then
            test "$(docker image inspect "$ref" --format '{{index .Config.Labels "ai.zlia.build-key"}}')" = "$KEY"
          fi
          if [ "$IMAGE" = manager ] && [ -n "$KEY" ]; then
            test "$(docker image inspect "$ref" --format '{{index .Config.Labels "ai.zlia.cliproxy-build-key"}}')" = "$KEY"
          fi
          if [ "$IMAGE" = cliproxyapi ]; then
            test "$(docker image inspect "$ref" --format '{{index .Config.Labels "ai.zlia.source-revision"}}')" = "$CPA_REVISION"
            test "$(docker image inspect "$ref" --format '{{index .Config.Labels "ai.zlia.patch-sha256"}}')" = "$PATCH_SHA256"
            test "$(docker image inspect "$ref" --format '{{index .Config.Labels "ai.zlia.managed-identity-version"}}')" = 1
          fi
          case "$IMAGE" in
            litellm) docker run --rm --entrypoint python -e LITELLM_LOCAL_MODEL_COST_MAP=True "$ref" -c 'import litellm; import litellm.proxy.proxy_server; print("LiteLLM imports passed")' ;;
            manager) docker run --rm --entrypoint python "$ref" -c 'from account_pool.app import create_app; print("Manager imports passed")' ;;
            browser-worker) docker run --rm --entrypoint python "$ref" -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); print(b.version); b.close(); p.stop()' ;;
            cliproxyapi) python3 account-pool/cliproxy-adapter/probe_managed_identity.py --image "$ref" ;;
          esac

      - name: Record the built image digest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
          REVISION: ${{ steps.identity.outputs.revision }}
          KEY: ${{ steps.identity.outputs.key }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/image-digests
          jq -n --arg image "$IMAGE" --arg arch "$ARCH" --arg digest "$DIGEST" --arg revision "$REVISION" --arg key "$KEY" \
            '{image:$image, arch:$arch, digest:$digest, revision:$revision, probe:"passed"} + (if $key != "" and ($image == "manager" or $image == "cliproxyapi") then {cpa_build_key:$key} else {} end)' > "/tmp/image-digests/${IMAGE}-${ARCH}.json"
          if [ "$IMAGE" = cliproxyapi ] && [ -n "$KEY" ]; then
            ref="${IMAGE_REPOSITORY}:cpa-${ARCH}-${KEY}"
            if existing="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/tmp/cpa-reuse-error)"; then
              test "$existing" = "$DIGEST"
            elif grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/cpa-reuse-error; then
              docker buildx imagetools create --prefer-index=false --tag "$ref" "${IMAGE_REPOSITORY}@${DIGEST}"
              test "$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')" = "$DIGEST"
            else
              cat /tmp/cpa-reuse-error >&2
              exit 1
            fi
          fi

      - name: Upload the image digest
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: build-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/image-digests/${{ matrix.image }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish ${{ matrix.image }} selected-platform SHA manifest
    needs: [version, build-and-publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [litellm, manager, browser-worker, cliproxyapi]
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-digest-${{ matrix.image }}-*
          path: /tmp/image-digests
          merge-multiple: true
      - name: Publish only the verified SHA tag without replacing existing tags
        env:
          IMAGE: ${{ matrix.image }}
          DEPLOY_TAG: ${{ needs.version.outputs.deploy_tag }}
          ARCHITECTURES: ${{ needs.version.outputs.architectures }}
        run: |
          ref="${IMAGE_REPOSITORY}:${IMAGE}-${DEPLOY_TAG}"
          sources=()
          while IFS= read -r arch; do
            digest="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' "/tmp/image-digests/${IMAGE}-${arch}.json")"
            sources+=("${IMAGE_REPOSITORY}@${digest}")
          done < <(jq -r ".[]" <<< "$ARCHITECTURES")
          docker buildx imagetools create --dry-run "${sources[@]}" > /tmp/proposed.json
          if docker buildx imagetools inspect "$ref" --raw > /tmp/existing.json 2>/tmp/inspect-error; then
            diff <(jq -S '.manifests | sort_by(.digest)' /tmp/proposed.json) <(jq -S '.manifests | sort_by(.digest)' /tmp/existing.json)
          else
            if ! grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/inspect-error; then
              cat /tmp/inspect-error >&2
              exit 1
            fi
            docker buildx imagetools create --tag "$ref" "${sources[@]}"
          fi
          docker buildx imagetools inspect "$ref" --raw > /tmp/published.json
          diff <(jq -S '.manifests | sort_by(.digest)' /tmp/proposed.json) <(jq -S '.manifests | sort_by(.digest)' /tmp/published.json)
          digest="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')"
          jq --arg image "$IMAGE" --arg digest "$digest" '{image: $image, digest: $digest, platforms: [.manifests[].platform | select(.os == "linux") | .os + "/" + .architecture] | unique | sort}' /tmp/published.json > "/tmp/image-digests/${IMAGE}.json"
          platforms="$(jq -c 'map("linux/" + .) | sort' <<< "$ARCHITECTURES")"
          jq -e --argjson platforms "$platforms" '.platforms == $platforms' "/tmp/image-digests/${IMAGE}.json"
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-digest-${{ matrix.image }}
          path: /tmp/image-digests/${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

  release-manifest:
    name: Verify and record the complete four-component release
    needs: [version, publish-manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: '*-digest-*'
          path: /tmp/image-digests
          merge-multiple: true
      - name: Require every selected platform probe and all four manifests
        env:
          REVISION: ${{ needs.version.outputs.revision }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
          ARCHITECTURES: ${{ needs.version.outputs.architectures }}
        run: |
          architectures="$(jq -r 'join(",")' <<< "$ARCHITECTURES")"
          python deploy/release_manifest.py --architectures "$architectures" --revision "$REVISION" --version "$RELEASE_VERSION" --digests /tmp/image-digests --output /tmp/release-manifest.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: release-manifest-${{ needs.version.outputs.versioned_tag }}
          path: /tmp/release-manifest.json
          if-no-files-found: error
          retention-days: 90

  publish-version-alias:
    name: Publish ${{ matrix.image }} successful version aliases
    needs: [version, release-manifest]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [litellm, manager, browser-worker, cliproxyapi]
    steps:
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ needs.version.outputs.versioned_tag }}
          path: /tmp
      - name: Alias verified digests without moving existing versions
        env:
          IMAGE: ${{ matrix.image }}
          VERSIONED_TAG: ${{ needs.version.outputs.versioned_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
        run: |
          digest="$(jq -er --arg component "$IMAGE" '.images[$component].digest' /tmp/release-manifest.json)"
          for tag in "$VERSIONED_TAG" "$RELEASE_VERSION"; do
            ref="${IMAGE_REPOSITORY}:${IMAGE}-${tag}"
            if existing="$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>/tmp/inspect-error)"; then
              if [ "$existing" != "$digest" ]; then
                echo "refusing to replace existing image tag $ref" >&2
                exit 1
              fi
            else
              if ! grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/inspect-error; then
                cat /tmp/inspect-error >&2
                exit 1
              fi
              docker buildx imagetools create --tag "$ref" "${IMAGE_REPOSITORY}@${digest}"
            fi
            test "$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')" = "$digest"
          done

  create-git-tag:
    name: Publish the immutable Git release and durable manifest
    needs:
      - version
      - publish-manifest
      - publish-version-alias
      - summary
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ needs.version.outputs.versioned_tag }}
          path: /tmp
      - name: Create the versioned tag without moving existing refs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TAG: ${{ needs.version.outputs.versioned_tag }}
          REVISION: ${{ needs.version.outputs.revision }}
        with:
          script: |
            const tag = process.env.TAG;
            const revision = process.env.REVISION;
            const fs = require('fs');
            const manifest = fs.readFileSync('/tmp/release-manifest.json');
            const metadata = JSON.parse(manifest.toString('utf8'));
            if (metadata.revision !== revision || metadata.versioned_tag !== tag) {
              throw new Error('Release manifest identity mismatch');
            }

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: revision,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              if (existing.data.object.sha !== revision) {
                throw new Error(`Tag ${tag} already points to ${existing.data.object.sha}, expected ${revision}`);
              }
            }

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: revision,
                name: tag,
                draft: true,
                body: 'Verified four-component release. See release-manifest.json for pinned image digests and provenance. No server deployment is performed',
              })).data;
            }
            if (release.name !== tag || release.tag_name !== tag) {
              throw new Error('Refusing to modify an unrelated GitHub release');
            }
            const asset = release.assets.find(item => item.name === 'release-manifest.json');
            if (asset) {
              const existing = await github.rest.repos.getReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
                headers: { accept: 'application/octet-stream' },
              });
              if (!Buffer.from(existing.data).equals(manifest)) {
                throw new Error('Refusing to replace an existing release manifest');
              }
            } else {
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                name: 'release-manifest.json',
                data: manifest,
                headers: { 'content-type': 'application/json', 'content-length': manifest.length },
              });
            }
            if (release.draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                draft: false,
              });
            }

  summary:
    name: Write deployment summary
    needs: [version, publish-version-alias]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest-${{ needs.version.outputs.versioned_tag }}
          path: /tmp
      - name: Write verified image references
        run: |
          {
            echo '## Published four-component release'
            jq -r '"Product version: " + .version + "; immutable build: " + .versioned_tag, (.images | to_entries[] | "- " + .key + ": `" + .value.image + "@" + .value.digest + "`")' /tmp/release-manifest.json
            echo 'Publication does not deploy or recreate any account containers. Historical packages and tags are unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
