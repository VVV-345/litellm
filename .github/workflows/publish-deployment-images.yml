name: Publish deployment images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要构建的分支或完整 commit，留空使用当前工作流版本'
        required: false
        type: string
  push:
    branches:
      - CLIProxyAPI分支
      - 'codex/fix-*'

concurrency:
  group: publish-deployment-images-${{ github.ref }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vvv-345

jobs:
  version:
    name: Resolve deployment version
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.version.outputs.deploy_tag }}
      revision: ${{ steps.version.outputs.revision }}
      release_version: ${{ steps.version.outputs.release_version }}
      versioned_tag: ${{ steps.version.outputs.versioned_tag }}
    steps:
      - name: Resolve the selected source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: version
        name: Resolve fixed product version and immutable deployment tag
        shell: bash
        run: |
          python deploy/release_version.py deploy/VERSION "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-quota:
    name: Verify quota switching and release compatibility
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_USER: proxy_catalog_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: proxy_catalog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proxy_catalog_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: account-pool:.
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      PROXY_CATALOG_TEST_DATABASE_URL: postgresql://proxy_catalog_test:isolated-test-only@127.0.0.1:5432/proxy_catalog_test
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Install locked backend dependencies
        run: .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra proxy
      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - name: Run quota, persistence and automatic replacement gates
        run: |
          uv run --no-sync python -m pytest -q \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_quota_failover.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_native_routing.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_reconciler.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_full_logs.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_observability.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_endpoints.py::test_proxy_admin_can_manage_upstream_compatibility_workflow \
            tests/test_litellm/proxy/management_endpoints/test_deployment_version.py \
            account-pool/tests/test_account_pool.py \
            account-pool/tests/account_pool/test_upstream_sync.py \
            account-pool/tests/account_pool/test_settings.py \
            account-pool/tests/account_pool/test_policies.py \
            account-pool/tests/account_pool/test_isp_profiles.py \
            account-pool/tests/account_pool/test_proxy_catalog_schema.py \
            account-pool/tests/account_pool/test_proxy_catalog_postgres.py \
            account-pool/tests/account_pool/test_proxy_gateways.py \
            account-pool/tests/account_pool/test_proxy_configuration.py \
            account-pool/tests/test_release_auto_update.py \
            account-pool/tests/test_release_catalog.py \
            account-pool/tests/test_release_database.py \
            account-pool/tests/test_release_workflow.py \
            account-pool/tests/test_releases.py \
            account-pool/tests/test_release_runtime.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: npm
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install and verify quota settings UI
        working-directory: ui/litellm-dashboard
        env:
          TZ: Asia/Shanghai
        run: |
          npm ci
          npm exec -- vitest run --project component \
            src/components/Settings/RuntimeSettings/RuntimeSettingsSection.test.tsx \
            src/features/account-pool/components/dashboard/AccountPoolDashboard.test.tsx \
            src/features/account-pool/components/dashboard/AccountPoolSettingsOverview.test.tsx \
            src/features/account-pool/components/upstream/AccountPoolUpstreamSyncPanel.test.tsx
          npm exec -- vitest run --project integration \
            src/features/account-pool/components/proxy/ProxyManagerPanel.integration.test.tsx
          npm exec -- vitest run --project unit \
            src/features/account-pool/api/AccountPoolManagementApi.test.ts
          npm exec -- vitest run --project integration \
            src/features/account-pool/components/onboarding/AccountPoolOnboardingPanel.integration.test.tsx

  build-and-publish:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [version, verify-quota]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: litellm
            context: .
            file: Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: litellm
            context: .
            file: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: account-pool-manager
            context: account-pool
            file: account-pool/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: account-pool-manager
            context: account-pool
            file: account-pool/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: account-pool-browser-worker
            context: account-pool
            file: account-pool/browser-worker/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: account-pool-browser-worker
            context: account-pool
            file: account-pool/browser-worker/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the commit to publish
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        name: Build ${{ matrix.image }} for ${{ matrix.arch }} by digest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version.outputs.revision }}
            org.opencontainers.image.version=${{ needs.version.outputs.release_version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record the built image digest
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/image-digests
          printf '{"image":"%s","arch":"%s","digest":"%s"}\n' \
            "$IMAGE" "$ARCH" "$DIGEST" > "/tmp/image-digests/${IMAGE}-${ARCH}.json"

      - name: Upload the image digest
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: build-digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/image-digests/${{ matrix.image }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish ${{ matrix.image }} multi-arch manifest
    needs:
      - version
      - build-and-publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - litellm
          - account-pool-manager
          - account-pool-browser-worker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-digest-${{ matrix.image }}-*
          path: /tmp/image-digests
          merge-multiple: true

      - name: Publish the shared version tag
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DEPLOY_TAG: ${{ needs.version.outputs.deploy_tag }}
          VERSIONED_TAG: ${{ needs.version.outputs.versioned_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          amd64_digest="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' "/tmp/image-digests/${IMAGE}-amd64.json")"
          arm64_digest="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' "/tmp/image-digests/${IMAGE}-arm64.json")"
          docker buildx imagetools create \
            --tag "${image}:${DEPLOY_TAG}" \
            --tag "${image}:${VERSIONED_TAG}" \
            "${image}@${amd64_digest}" \
            "${image}@${arm64_digest}"
          docker buildx imagetools inspect "${image}:${DEPLOY_TAG}"

  create-git-tag:
    name: Create immutable release Git tag
    needs:
      - version
      - publish-manifest
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Create the versioned tag without moving existing refs
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TAG: ${{ needs.version.outputs.versioned_tag }}
          REVISION: ${{ needs.version.outputs.revision }}
        with:
          script: |
            const tag = process.env.TAG;
            const revision = process.env.REVISION;

            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: revision,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
              const existing = await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              if (existing.data.object.sha !== revision) {
                throw new Error(`Tag ${tag} already points to ${existing.data.object.sha}, expected ${revision}`);
              }
            }

  clean-package-versions:
    name: Retain recent package versions
    needs: publish-manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - litellm
          - account-pool-manager
          - account-pool-browser-worker
    steps:
      - name: Retain the latest 20 versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.IMAGE_NAMESPACE }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-versions: '^v1\.[0-9]+-.*$'

  summary:
    name: Write deployment summary
    needs:
      - version
      - build-and-publish
      - publish-manifest
      - create-git-tag
      - clean-package-versions
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx for digest reporting
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry for digest reporting
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write image references
        shell: bash
        env:
          DEPLOY_TAG: ${{ needs.version.outputs.deploy_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
          VERSIONED_TAG: ${{ needs.version.outputs.versioned_tag }}
        run: |
          worker_image="${REGISTRY}/${IMAGE_NAMESPACE}/account-pool-browser-worker:${DEPLOY_TAG}"
          worker_digest="$(docker buildx imagetools inspect "$worker_image" --format '{{.Manifest.Digest}}')"
          {
            echo "## Deployment images"
            echo "Product version: ${RELEASE_VERSION}; immutable build: ${VERSIONED_TAG}"
            echo
            echo "Use \`DEPLOY_TAG=${DEPLOY_TAG}\` on the server."
            echo
            echo "- \`ghcr.io/vvv-345/litellm:${DEPLOY_TAG}\`"
            echo "- \`ghcr.io/vvv-345/account-pool-manager:${DEPLOY_TAG}\`"
            echo "- \`ghcr.io/vvv-345/account-pool-browser-worker:${DEPLOY_TAG}\`"
            echo "- Worker digest: \`${worker_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
