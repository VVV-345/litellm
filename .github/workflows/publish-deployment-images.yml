name: Publish deployment images

on:
  push:
    branches:
      - CLIProxyAPI分支

concurrency:
  group: publish-deployment-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vvv-345

jobs:
  version:
    name: Resolve deployment version
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.version.outputs.deploy_tag }}
    steps:
      - id: version
        name: Use the commit prefix as the deployment tag
        shell: bash
        run: printf 'deploy_tag=%.10s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  build-and-publish:
    name: Publish ${{ matrix.image }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: litellm
            context: .
            file: Dockerfile
            cache_scope: litellm
          - image: account-pool-manager
            context: account-pool
            file: account-pool/Dockerfile
            cache_scope: account-pool-manager
    steps:
      - name: Check out the commit to publish
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.version.outputs.deploy_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  clean-package-versions:
    name: Retain recent package versions
    needs: build-and-publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - litellm
          - account-pool-manager
    steps:
      - name: Retain the latest 20 versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.IMAGE_NAMESPACE }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Write deployment summary
    needs:
      - version
      - build-and-publish
      - clean-package-versions
    runs-on: ubuntu-latest
    steps:
      - name: Write image references
        shell: bash
        env:
          DEPLOY_TAG: ${{ needs.version.outputs.deploy_tag }}
        run: |
          {
            echo "## Deployment images"
            echo
            echo "Use \`DEPLOY_TAG=${DEPLOY_TAG}\` on the server."
            echo
            echo "- \`ghcr.io/vvv-345/litellm:${DEPLOY_TAG}\`"
            echo "- \`ghcr.io/vvv-345/account-pool-manager:${DEPLOY_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
