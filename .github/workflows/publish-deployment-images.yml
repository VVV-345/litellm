name: Publish deployment images

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '要构建的分支或完整 commit，留空使用当前工作流版本'
        required: false
        type: string
  push:
    branches:
      - CLIProxyAPI分支
      - 'codex/fix-*'

concurrency:
  group: publish-deployment-images-${{ github.ref }}-${{ inputs.source_ref || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: vvv-345

jobs:
  version:
    name: Resolve deployment version
    runs-on: ubuntu-latest
    outputs:
      deploy_tag: ${{ steps.version.outputs.deploy_tag }}
      revision: ${{ steps.version.outputs.revision }}
      release_version: ${{ steps.version.outputs.release_version }}
      versioned_tag: ${{ steps.version.outputs.versioned_tag }}
    steps:
      - name: Resolve the selected source
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - id: version
        name: Resolve fixed product version and immutable deployment tag
        shell: bash
        run: |
          python deploy/release_version.py deploy/VERSION "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-quota:
    name: Verify quota switching and release compatibility
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: account-pool:.
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-uv-with-retries
        with:
          version: '0.10.9'
      - name: Install locked backend dependencies
        run: .github/scripts/uv_sync_with_retries.sh --frozen --group ci --group proxy-dev --extra proxy
      - name: Generate Prisma client
        run: uv run --no-sync prisma generate --schema litellm/proxy/schema.prisma
      - name: Run quota, persistence and automatic replacement gates
        run: |
          uv run --no-sync python -m pytest -q \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_quota_failover.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_native_routing.py \
            tests/test_litellm/proxy/management_endpoints/test_account_pool_reconciler.py \
            tests/test_litellm/proxy/management_endpoints/test_deployment_version.py \
            account-pool/tests/test_account_pool.py \
            account-pool/tests/account_pool/test_settings.py \
            account-pool/tests/account_pool/test_policies.py \
            account-pool/tests/test_release_auto_update.py \
            account-pool/tests/test_release_catalog.py \
            account-pool/tests/test_release_database.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: ui/litellm-dashboard/.nvmrc
          cache: npm
          cache-dependency-path: ui/litellm-dashboard/package-lock.json
      - name: Install and verify quota settings UI
        working-directory: ui/litellm-dashboard
        run: |
          npm ci
          npm exec -- vitest run --project component \
            src/components/Settings/RuntimeSettings/RuntimeSettingsSection.test.tsx \
            src/features/account-pool/components/dashboard/AccountPoolSettingsOverview.test.tsx

  build-and-publish:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    needs: [version, verify-quota]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: litellm
            context: .
            file: Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: litellm
            context: .
            file: Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: account-pool-manager
            context: account-pool
            file: account-pool/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: account-pool-manager
            context: account-pool
            file: account-pool/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
          - image: account-pool-browser-worker
            context: account-pool
            file: account-pool/browser-worker/Dockerfile
            arch: amd64
            runner: ubuntu-latest
          - image: account-pool-browser-worker
            context: account-pool
            file: account-pool/browser-worker/Dockerfile
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the commit to publish
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ needs.version.outputs.revision }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ${{ matrix.image }} for ${{ matrix.arch }}
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.version.outputs.deploy_tag }}-${{ matrix.arch }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}:${{ needs.version.outputs.versioned_tag }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.version.outputs.revision }}
            org.opencontainers.image.version=${{ needs.version.outputs.release_version }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish ${{ matrix.image }} multi-arch manifest
    needs:
      - version
      - build-and-publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - litellm
          - account-pool-manager
          - account-pool-browser-worker
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the shared version tag
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          DEPLOY_TAG: ${{ needs.version.outputs.deploy_tag }}
          VERSIONED_TAG: ${{ needs.version.outputs.versioned_tag }}
        run: |
          image="${REGISTRY}/${IMAGE_NAMESPACE}/${IMAGE}"
          docker buildx imagetools create \
            --tag "${image}:${DEPLOY_TAG}" \
            --tag "${image}:${VERSIONED_TAG}" \
            "${image}:${DEPLOY_TAG}-amd64" \
            "${image}:${DEPLOY_TAG}-arm64"
          docker buildx imagetools inspect "${image}:${DEPLOY_TAG}"

  clean-package-versions:
    name: Retain recent package versions
    needs: publish-manifest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - litellm
          - account-pool-manager
          - account-pool-browser-worker
    steps:
      - name: Retain the latest 20 versions of ${{ matrix.package }}
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          owner: ${{ env.IMAGE_NAMESPACE }}
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 20
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore-versions: '^v1\.1-.*$'

  summary:
    name: Write deployment summary
    needs:
      - version
      - build-and-publish
      - publish-manifest
      - clean-package-versions
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx for digest reporting
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry for digest reporting
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write image references
        shell: bash
        env:
          DEPLOY_TAG: ${{ needs.version.outputs.deploy_tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.release_version }}
          VERSIONED_TAG: ${{ needs.version.outputs.versioned_tag }}
        run: |
          worker_image="${REGISTRY}/${IMAGE_NAMESPACE}/account-pool-browser-worker:${DEPLOY_TAG}"
          worker_digest="$(docker buildx imagetools inspect "$worker_image" --format '{{.Manifest.Digest}}')"
          {
            echo "## Deployment images"
            echo "Product version: ${RELEASE_VERSION}; immutable build: ${VERSIONED_TAG}"
            echo
            echo "Use \`DEPLOY_TAG=${DEPLOY_TAG}\` on the server."
            echo
            echo "- \`ghcr.io/vvv-345/litellm:${DEPLOY_TAG}\`"
            echo "- \`ghcr.io/vvv-345/account-pool-manager:${DEPLOY_TAG}\`"
            echo "- \`ghcr.io/vvv-345/account-pool-browser-worker:${DEPLOY_TAG}\`"
            echo "- Worker digest: \`${worker_digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
