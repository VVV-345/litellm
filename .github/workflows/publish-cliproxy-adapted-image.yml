name: Publish adapted CLIProxyAPI image

on:
  workflow_dispatch:

concurrency:
  group: publish-cliproxy-adapted-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pin:
    name: Resolve adapted image pin
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      tag: ${{ steps.pin.outputs.tag }}
      image: ${{ steps.pin.outputs.image }}
    steps:
      - name: Check out the adapter pin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - id: pin
        name: Read the content-addressed image reference
        run: python account-pool/cliproxy-adapter/image_ref.py >> "$GITHUB_OUTPUT"

  build:
    name: Build and probe (${{ matrix.arch }})
    needs: pin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Check out the adapter pin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Check out the pinned CLIProxyAPI commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: VVV-345/CLIProxyAPI
          ref: ${{ needs.pin.outputs.commit }}
          path: cliproxy-src
          persist-credentials: false

      - name: Set up uv
        uses: ./.github/actions/setup-uv-with-retries
        with:
          version: "0.10.9"

      - name: Install the adapter apply dependency
        working-directory: account-pool
        run: uv sync --frozen --no-dev --no-editable

      - name: Apply the settings adaptation patch
        run: account-pool/.venv/bin/python account-pool/cliproxy-adapter/apply.py cliproxy-src

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build the adapted image for probing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: cliproxy-src
          file: cliproxy-src/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: cliproxy-adapted:probe
          build-args: |
            VERSION=${{ needs.pin.outputs.tag }}
            COMMIT=${{ needs.pin.outputs.commit }}
          cache-from: type=gha,scope=cliproxy-adapted-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cliproxy-adapted-${{ matrix.arch }}

      - name: Probe managed-identity before publishing
        run: python3 account-pool/cliproxy-adapter/probe_managed_identity.py --image cliproxy-adapted:probe

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        name: Push the probed image by digest
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: cliproxy-src
          file: cliproxy-src/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.pin.outputs.tag }}
            COMMIT=${{ needs.pin.outputs.commit }}
          outputs: type=image,name=ghcr.io/vvv-345/cliproxyapi,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=cliproxy-adapted-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cliproxy-adapted-${{ matrix.arch }}

      - name: Record the probed image digest
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          test -n "$DIGEST"
          mkdir -p /tmp/image-digests
          printf '{"arch":"%s","digest":"%s"}\n' "$ARCH" "$DIGEST" > "/tmp/image-digests/cliproxyapi-${ARCH}.json"

      - name: Upload the image digest
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: cliproxy-adapted-digest-${{ matrix.arch }}
          path: /tmp/image-digests/cliproxyapi-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish the adapted multi-arch tag
    needs: [pin, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the adapter pin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: cliproxy-adapted-digest-*
          path: /tmp/image-digests
          merge-multiple: true

      - name: Publish only the content-addressed tag
        env:
          EXPECTED_IMAGE: ${{ needs.pin.outputs.image }}
        run: |
          image="$(python account-pool/cliproxy-adapter/image_ref.py | sed -n 's/^image=//p')"
          test "$image" = "$EXPECTED_IMAGE"
          case "$image" in
            *:latest|*bebf587*|eceasy/*) echo "refusing production tag" >&2; exit 1 ;;
          esac
          if docker buildx imagetools inspect "$image" >/dev/null 2>&1; then
            echo "refusing to replace an existing adapted image tag" >&2
            exit 1
          fi
          amd64_digest="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' /tmp/image-digests/cliproxyapi-amd64.json)"
          arm64_digest="$(jq -er '.digest | select(type == "string" and startswith("sha256:"))' /tmp/image-digests/cliproxyapi-arm64.json)"
          docker buildx imagetools create \
            --tag "$image" \
            "ghcr.io/vvv-345/cliproxyapi@${amd64_digest}" \
            "ghcr.io/vvv-345/cliproxyapi@${arm64_digest}"
          docker buildx imagetools inspect "$image"
