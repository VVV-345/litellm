# 本文件在单台服务器上部署完整号池栈：LiteLLM、号池 Manager、数据库、Docker Socket Proxy。
# 镜像全部来自 ghcr.io/vvv-345，tag 统一用部署时的 commit 号，升级只改 TAG。
# 使用方法见同目录 DEPLOY.md

services:
  db:
    container_name: litellm_db
    image: postgres:16@sha256:c31077828b6a25f169fcd1bdf769af0e1c5cb8eb14a5729c8bc766842347580b
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${LITELLM_DB_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - litellm-db

  litellm:
    container_name: litellm
    image: ghcr.io/vvv-345/litellm:${DEPLOY_TAG:?set DEPLOY_TAG}
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: postgresql://llmproxy:${LITELLM_DB_PASSWORD:?set LITELLM_DB_PASSWORD}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      UI_USERNAME: ${UI_USERNAME:-}
      UI_PASSWORD: ${UI_PASSWORD:-}
      ACCOUNT_POOL_MANAGER_URL: http://account-pool:8091
      ACCOUNT_POOL_MANAGER_TOKEN: ${ACCOUNT_POOL_MANAGER_TOKEN:?set ACCOUNT_POOL_MANAGER_TOKEN}
      ACCOUNT_POOL_RECONCILE_INTERVAL_SECONDS: ${ACCOUNT_POOL_RECONCILE_INTERVAL_SECONDS:-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AZURE_API_BASE: ${AZURE_API_BASE:-}
      AZURE_API_VERSION: ${AZURE_API_VERSION:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      OR_SITE_URL: ${OR_SITE_URL:-}
      OR_APP_NAME: ${OR_APP_NAME:-}
      OR_API_KEY: ${OR_API_KEY:-}
      REPLICATE_API_KEY: ${REPLICATE_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      NOVITA_API_KEY: ${NOVITA_API_KEY:-}
      INFINITY_API_KEY: ${INFINITY_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      account-pool:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - default
      - litellm-db
      - litellm-control

  docker-socket-proxy:
    container_name: litellm-account-pool-socket-proxy
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=8m
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      INFO: "1"
      POST: "1"
      VOLUMES: "1"
      AUTH: "0"
      BUILD: "0"
      EXEC: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - account-pool-socket
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  account-pool:
    container_name: litellm-account-pool
    image: ghcr.io/vvv-345/account-pool-manager:${DEPLOY_TAG:?set DEPLOY_TAG}
    restart: unless-stopped
    environment:
      ACCOUNT_POOL_DATABASE_URL: postgresql://account_pool:${ACCOUNT_POOL_DB_PASSWORD:?set ACCOUNT_POOL_DB_PASSWORD}@account-pool-db:5432/account_pool
      ACCOUNT_POOL_MANAGER_TOKEN: ${ACCOUNT_POOL_MANAGER_TOKEN:?set ACCOUNT_POOL_MANAGER_TOKEN}
      ACCOUNT_POOL_SECRET_SEED: ${ACCOUNT_POOL_SECRET_SEED:?set ACCOUNT_POOL_SECRET_SEED}
      ACCOUNT_POOL_DATA_ROOT: /var/lib/litellm-account-pool/environments
      ACCOUNT_POOL_MANAGER_CONTAINER: litellm-account-pool
      ACCOUNT_POOL_GATEWAY_CONTAINER: litellm
      ACCOUNT_POOL_SSH_HOST: ${ACCOUNT_POOL_SSH_HOST:?set ACCOUNT_POOL_SSH_HOST}
      ACCOUNT_POOL_SSH_USER: ${ACCOUNT_POOL_SSH_USER:?set ACCOUNT_POOL_SSH_USER}
      ACCOUNT_POOL_CALLBACK_PORT: ${ACCOUNT_POOL_CALLBACK_PORT:-8091}
      ACCOUNT_POOL_CALLBACK_BIND_HOST: ${ACCOUNT_POOL_CALLBACK_BIND_HOST:-127.0.0.1}
      ACCOUNT_POOL_CLASH_CONTROLLER_URL: ${ACCOUNT_POOL_CLASH_CONTROLLER_URL:-}
      ACCOUNT_POOL_CLASH_SECRET: ${ACCOUNT_POOL_CLASH_SECRET:-}
      ACCOUNT_POOL_CLASH_CONFIG_PATH: ${ACCOUNT_POOL_CLASH_CONFIG_PATH:-}
      ACCOUNT_POOL_CLASH_CONFIG_DIR: ${ACCOUNT_POOL_CLASH_CONFIG_DIR:-/opt/litellm/mihomo}
      ACCOUNT_POOL_CLASH_RUNTIME_CONFIG_PATH: ${ACCOUNT_POOL_CLASH_RUNTIME_CONFIG_PATH:-/root/.config/mihomo/config.yaml}
      ACCOUNT_POOL_CLASH_GATEWAY_PORTS: ${ACCOUNT_POOL_CLASH_GATEWAY_PORTS:-}
      ACCOUNT_POOL_DOCKER_HOST: tcp://docker-socket-proxy:2375
      ACCOUNT_POOL_DOCKER_COMMAND_TIMEOUT_SECONDS: ${ACCOUNT_POOL_DOCKER_COMMAND_TIMEOUT_SECONDS:-60}
      ACCOUNT_POOL_CLI_PROXY_USER: ${ACCOUNT_POOL_CLI_PROXY_USER:-65532:65532}
      ACCOUNT_POOL_CLI_PROXY_IMAGE: ${ACCOUNT_POOL_CLI_PROXY_IMAGE:-eceasy/cli-proxy-api:v7.2.155@sha256:3990e4de484ac5caac80164ee3a60d0ba521320dcda193a2ef71a5ad2e2c768b}
      ACCOUNT_POOL_PROXY_GATEWAY_HOST: ${ACCOUNT_POOL_PROXY_GATEWAY_HOST:-host.docker.internal}
      ACCOUNT_POOL_PLUGIN_REGISTRY_JSON: ${ACCOUNT_POOL_PLUGIN_REGISTRY_JSON:-}
      ACCOUNT_POOL_LOG_RETENTION_DAYS: ${ACCOUNT_POOL_LOG_RETENTION_DAYS:-30}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:${ACCOUNT_POOL_CALLBACK_PORT:-8091}:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - account_pool_data:/var/lib/litellm-account-pool/environments
      - ${ACCOUNT_POOL_CLASH_CONFIG_DIR:-/opt/litellm/mihomo}:${ACCOUNT_POOL_CLASH_CONFIG_DIR:-/opt/litellm/mihomo}:rw
    networks:
      - account-pool-socket
      - account-pool-manager-db
      - litellm-control
      - account-pool-public
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      account-pool-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  account-pool-db:
    container_name: litellm-account-pool-db
    image: postgres:16@sha256:c31077828b6a25f169fcd1bdf769af0e1c5cb8eb14a5729c8bc766842347580b
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_pool
      POSTGRES_USER: account_pool
      POSTGRES_PASSWORD: ${ACCOUNT_POOL_DB_PASSWORD:?set ACCOUNT_POOL_DB_PASSWORD}
    volumes:
      - account_pool_db:/var/lib/postgresql/data
    networks:
      - account-pool-manager-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_pool -d account_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  account-pool-public:
    name: account-pool-public
    internal: false
  litellm-db:
    name: litellm-db
    internal: true
  litellm-control:
    name: litellm-control
    internal: true
  account-pool-socket:
    name: account-pool-socket
    internal: true
  account-pool-manager-db:
    name: account-pool-manager-db
    internal: true

volumes:
  postgres_data:
    name: litellm_postgres_data
  account_pool_data:
  account_pool_db:
