# 本文件编排 LiteLLM、Account Pool、PostgreSQL 和 Redis 的本地一体化运行环境。
services:
  litellm:
    build: .
    image: litellm-custom
    #########################################
    ## Uncomment these lines to start proxy with a config.yaml file ##
    # volumes:
    #  - ./config.yaml:/app/config.yaml
    # command:
    #  - "--config=/app/config.yaml"
    ##############################################
    ports:
      - "4000:4000" # Map the container port to the host, change the host port if necessary
    environment:
      DATABASE_URL: "postgresql://llmproxy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/litellm"
      # Optional: route read-only queries (find_*, count, group_by, query_raw/_first)
      # to a separate reader endpoint, e.g. an Aurora reader. Leave unset for
      # single-DB deployments. With IAM_TOKEN_DB_AUTH enabled, the reader URL
      # is auto-refreshed alongside the writer.
      # DATABASE_URL_READ_REPLICA: "postgresql://llmproxy:${POSTGRES_PASSWORD}@db-reader:5432/litellm"
      STORE_MODEL_IN_DB: "True" # allows adding models to proxy via UI
      # Admin UI 只通过该内网地址访问号池，服务令牌不会发送到浏览器。
      ACCOUNT_POOL_INTERNAL_URL: "http://account-pool:4100"
      ACCOUNT_POOL_INTERNAL_TOKEN: "${ACCOUNT_POOL_INTERNAL_TOKEN:?Set ACCOUNT_POOL_INTERNAL_TOKEN in .env}"
      ACCOUNT_POOL_ACTOR_SECRET: "${ACCOUNT_POOL_ACTOR_SECRET:?Set ACCOUNT_POOL_ACTOR_SECRET in .env}"
    env_file:
      - .env # Load local .env file
    depends_on:
      db:
        condition: service_healthy # 健康门控，避免冷启动时 Prisma 连不上数据库
    restart: unless-stopped
    healthcheck:  # Defines the health check configuration for the container
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"  # Command to execute for health check
      interval: 30s  # Perform health check every 30 seconds
      timeout: 10s   # Health check command times out after 10 seconds
      retries: 3     # Retry up to 3 times if health check fails
      start_period: 40s  # Wait 40 seconds after container start before beginning health checks

  account-pool:
    build:
      context: .
      dockerfile: account-pool/Dockerfile
      additional_contexts:
        litellm_image: docker-image://litellm:local
    image: litellm-account-pool
    ports:
      - "4100:4100"
    environment:
      ACCOUNT_POOL_STORE: "redis"
      ACCOUNT_POOL_REDIS_URL: "redis://redis:6379/0"
      ACCOUNT_POOL_CONFIG: "/data/accounts.yaml"
      # 快照目录落到专用卷，容器以非 root 运行时仍可写。
      ACCOUNT_POOL_PARSER_SNAPSHOT_ROOT: "/data/parser-snapshots"
      ACCOUNT_POOL_LEASE_TTL_SECONDS: "${ACCOUNT_POOL_LEASE_TTL_SECONDS:-120}"
      ACCOUNT_POOL_MAXIMUM_LEASE_SECONDS: "${ACCOUNT_POOL_MAXIMUM_LEASE_SECONDS:-3600}"
      ACCOUNT_POOL_LITELLM_URL: "http://litellm:4000"
      ACCOUNT_POOL_LITELLM_ADMIN_KEY: "${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}"
      ACCOUNT_POOL_INTERNAL_TOKEN: "${ACCOUNT_POOL_INTERNAL_TOKEN:?Set ACCOUNT_POOL_INTERNAL_TOKEN in .env}"
      ACCOUNT_POOL_ACTOR_SECRET: "${ACCOUNT_POOL_ACTOR_SECRET:?Set ACCOUNT_POOL_ACTOR_SECRET in .env}"
      DATABASE_URL: "postgresql://llmproxy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/litellm"
    volumes:
      # 渠道增删会原子写回该文件，Key 不会进入此配置。
      - ./account-pool/config/accounts.yaml:/data/accounts.yaml
      - account_pool_snapshot_data:/data/parser-snapshots
    depends_on:
      litellm:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    # 流式请求收尾依赖 drain 宽限期，默认 10s 会强杀连接并丢掉末段结算。
    stop_grace_period: 40s
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4100/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-gateway:
    build:
      context: .
      dockerfile: litellm-rust/crates/ai-gateway/Dockerfile
      additional_contexts:
        litellm_image: docker-image://litellm:local
    image: litellm-ai-gateway
    ports:
      - "4001:4001"
    environment:
      PORT: "4001"
      ACCOUNT_POOL_RUST_ENABLED: "true"
      ACCOUNT_POOL_RUNTIME_CONFIG_URL: "http://account-pool:4100/internal/runtime-config"
      ACCOUNT_POOL_INTERNAL_TOKEN: "${ACCOUNT_POOL_INTERNAL_TOKEN:?Set ACCOUNT_POOL_INTERNAL_TOKEN in .env}"
      ACCOUNT_POOL_REDIS_URL: "redis://redis:6379/0"
      ACCOUNT_POOL_LITELLM_URL: "http://litellm:4000"
      ACCOUNT_POOL_GATEWAY_PRE_AUTH: "${ACCOUNT_POOL_GATEWAY_PRE_AUTH:-true}"
    depends_on:
      account-pool:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4001/health/readiness')"
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - account_pool_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:16
    restart: always
    container_name: litellm_db
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    ports:
      - "127.0.0.1:5432:5432" # 仅绑定本机回环，避免数据库暴露到外网网卡
    volumes:
      - postgres_data:/var/lib/postgresql/data # Persists Postgres data across container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 1s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./account-pool/deploy/prometheus/account-pool-alerts.yml:/etc/prometheus/rules/account-pool-alerts.yml:ro
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - alertmanager
    restart: always

  alertmanager:
    image: prom/alertmanager:v0.28.1
    volumes:
      - ./account-pool/deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    restart: unless-stopped

volumes:
  account_pool_redis_data:
    name: litellm_account_pool_redis_data
  account_pool_snapshot_data:
    name: litellm_account_pool_snapshot_data
  prometheus_data:
    driver: local
  postgres_data:
    name: litellm_postgres_data # Named volume for Postgres data persistence
