# 本文件配置本地 Prometheus 抓取 LiteLLM 与 Account Pool，并加载号池告警规则。
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/account-pool-alerts.yml

scrape_configs:
  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']  # Assuming Litellm exposes metrics at port 4000

  - job_name: 'account-pool'
    metrics_path: /metrics
    static_configs:
      - targets: ['account-pool:4100']
