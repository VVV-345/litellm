# 本文件配置本地 Prometheus 抓取 LiteLLM 与 Account Pool，并加载号池告警规则。
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/rules/account-pool-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: 'account-pool'
    metrics_path: /metrics
    static_configs:
      - targets: ['account-pool:4100']
