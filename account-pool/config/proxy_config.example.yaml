# 本文件演示 LiteLLM Deployment 与号池渠道标识的配套配置。
model_list:
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY_PRIMARY
    model_info:
      id: pool-gpt4o-primary
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY_BACKUP
    model_info:
      id: pool-gpt4o-backup

router_settings:
  routing_strategy: simple-shuffle
