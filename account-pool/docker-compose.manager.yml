# 本文件提供号池 Manager 的最小部署模板，Manager 只在回环地址提供 OAuth 回调。
services:
  docker-socket-proxy:
    container_name: ${ACCOUNT_POOL_SOCKET_PROXY_CONTAINER:-litellm-account-pool-socket-proxy}
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /run:rw,noexec,nosuid,size=8m
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      NETWORKS: "1"
      INFO: "1"
      POST: "1"
      AUTH: "0"
      BUILD: "0"
      EXEC: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - account-pool-socket
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:2375/_ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  docker-cli-check:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["docker", "compose", "version"]
    environment:
      DOCKER_HOST: ${ACCOUNT_POOL_DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      HOME: /tmp
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - account-pool-socket

  account-pool:
    container_name: ${ACCOUNT_POOL_MANAGER_CONTAINER:-litellm-account-pool}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ACCOUNT_POOL_DATABASE_URL: ${ACCOUNT_POOL_DATABASE_URL}
      ACCOUNT_POOL_MANAGER_TOKEN: ${ACCOUNT_POOL_MANAGER_TOKEN}
      ACCOUNT_POOL_SECRET_SEED: ${ACCOUNT_POOL_SECRET_SEED}
      ACCOUNT_POOL_DATA_ROOT: /var/lib/litellm-account-pool/environments
      ACCOUNT_POOL_MANAGER_CONTAINER: ${ACCOUNT_POOL_MANAGER_CONTAINER:-litellm-account-pool}
      ACCOUNT_POOL_GATEWAY_CONTAINER: ${ACCOUNT_POOL_GATEWAY_CONTAINER:-litellm}
      ACCOUNT_POOL_SSH_HOST: ${ACCOUNT_POOL_SSH_HOST}
      ACCOUNT_POOL_SSH_USER: ${ACCOUNT_POOL_SSH_USER}
      ACCOUNT_POOL_CALLBACK_PORT: ${ACCOUNT_POOL_CALLBACK_PORT:-8091}
      ACCOUNT_POOL_CALLBACK_BIND_HOST: ${ACCOUNT_POOL_CALLBACK_BIND_HOST:-127.0.0.1}
      ACCOUNT_POOL_DOCKER_HOST: ${ACCOUNT_POOL_DOCKER_HOST:-tcp://docker-socket-proxy:2375}
      ACCOUNT_POOL_DOCKER_COMMAND_TIMEOUT_SECONDS: ${ACCOUNT_POOL_DOCKER_COMMAND_TIMEOUT_SECONDS:-60}
      ACCOUNT_POOL_CLI_PROXY_USER: ${ACCOUNT_POOL_CLI_PROXY_USER:-65532:65532}
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    ports:
      - "127.0.0.1:${ACCOUNT_POOL_CALLBACK_PORT:-8091}:8091"
    volumes:
      - account_pool_data:/var/lib/litellm-account-pool/environments
    networks:
      account-pool-socket: null
      litellm-control:
        aliases:
          - account-pool
    depends_on:
      docker-cli-check:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  db:
    container_name: ${ACCOUNT_POOL_DB_CONTAINER:-litellm-account-pool-db}
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: account_pool
      POSTGRES_USER: account_pool
      POSTGRES_PASSWORD: ${ACCOUNT_POOL_DB_PASSWORD}
    volumes:
      - account_pool_db:/var/lib/postgresql/data
    networks:
      - litellm-control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_pool -d account_pool"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  account-pool-socket:
    internal: true
  litellm-control:
    external: true
    name: ${ACCOUNT_POOL_CONTROL_NETWORK:-litellm-control}

volumes:
  account_pool_data:
  account_pool_db:
